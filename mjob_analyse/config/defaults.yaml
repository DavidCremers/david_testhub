# MJOB Analyse - Standaard Configuratie
# =====================================

# Algemene analyse instellingen
analyse:
  horizon_jaren: 60
  inflatie_percentage: 2.0
  start_jaar: 2024

# Drempelwaarden voor afwijkingen
drempels:
  prijs_afwijking_percentage: 15.0
  cyclus_afwijking_jaren: 3
  hoeveelheid_afwijking_percentage: 20.0
  match_confidence_minimum: 0.6

# Kolom mappings per systeemtype
# Elke mapping vertaalt systeemspecifieke kolommen naar standaard veldnamen
kolom_mappings:
  vastware:
    complex_id: "Complex"
    complex_omschrijving: "Complex Omschrijving"
    plaatsaanduiding: "Plaatsaanduiding"
    element_code: "Element"
    element_omschrijving: "Element Omschrijving"
    maatregel: "Maatregel omschrijving"
    hoeveelheid: "Hoeveelheid"
    eenheid: "Eenheid"
    eenheidsprijs: "Eenheidsprijs"
    cvo_element: "CVO Element"
    bouwjaar_element: "Bouwjaar Element"
    bouwjaar_object: "Bouwjaar Object"
    cyclus: "Cyclus"
    c_factor: "C.Factor"
    startjaar: "Eerste jaar"
    eindjaar: "Laatste jaar"
    prioriteit: "Prioriteitnummer"
    totaal_jaren: "Totaal Jaren"

  plato:
    complex_id: "Complexnummer"
    complex_omschrijving: "Complexnaam"
    element_code: "Elementcode"
    element_omschrijving: "Elementomschrijving"
    maatregel: "Maatregel"
    hoeveelheid: "Hoeveelheid"
    eenheid: "Eenheid"
    eenheidsprijs: "Eenheidsprijs"
    cyclus: "Cyclus"
    startjaar: "Startjaar"
    bouwjaar: "Bouwjaar"

  oprognose:
    complex_id: "Complex"
    element_omschrijving: "Element"
    maatregel: "Activiteit"
    hoeveelheid: "Aantal"
    eenheid: "Eenheid"
    eenheidsprijs: "Prijs"
    cyclus: "Interval"
    startjaar: "Startjaar"

  ibis:
    complex_id: "Complexnr"
    complex_omschrijving: "Complexnaam"
    element_code: "Elementnr"
    element_omschrijving: "Element"
    maatregel: "Maatregel"
    hoeveelheid: "Hoeveelheid"
    eenheid: "Eenheid"
