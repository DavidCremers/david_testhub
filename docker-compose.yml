# Aedes Carrière Nieuws Monitor - Docker Compose
# ===============================================
# 1. Kopieer .env.example naar .env en vul je gegevens in
# 2. Start: docker-compose up -d
# 3. Logs:  docker-compose logs -f

version: '3.8'

services:
  carriere-nieuws:
    build:
      context: .
      dockerfile: carriere_nieuws/Dockerfile
    container_name: carriere-nieuws-monitor
    restart: unless-stopped

    environment:
      # Email provider (sendgrid, mailgun, of smtp)
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-sendgrid}

      # Voor SendGrid/Mailgun
      - EMAIL_API_KEY=${EMAIL_API_KEY}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:-}

      # Voor SMTP (optioneel)
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}

      # Algemeen
      - SENDER_EMAIL=${SENDER_EMAIL}
      - SENDER_NAME=${SENDER_NAME:-Aedes Carrière Nieuws}
      - RECIPIENTS=${RECIPIENTS}

      # Instellingen
      - CHECK_INTERVAL_MINUTES=${CHECK_INTERVAL_MINUTES:-1440}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

    volumes:
      - carriere-nieuws-cache:/app/cache

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  carriere-nieuws-cache:
    name: carriere-nieuws-cache
